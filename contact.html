<main>

<div class="contact-form-container">

    <h2>Contact Us</h2>

    <p>
        Have a question about reef aquariums or coral care?
        Fill out the form below and we'll be happy to help.
    </p>

    <form id="contact-form" novalidate>

        <label for="name">Your Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Your Name"
            minlength="2"
            maxlength="50"
            required
        >

        <label for="email">Your Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Your Email"
            maxlength="100"
            required
        >

        <label for="subject">Email Subject</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Subject"
            maxlength="100"
            required
        >

        <label for="captcha">Security Question: 1 + 1 =</label>
        <input
            type="number"
            id="captcha"
            name="captcha"
            placeholder="Answer"
            required
        >

        <label for="message">Your Message</label>

        <textarea
            id="message"
            name="message"
            rows="6"
            maxlength="1000"
            placeholder="Your Message"
            required
        ></textarea>

        <button type="submit">Send Message</button>

        <p id="form-status"></p>

    </form>

</div>

</main>
